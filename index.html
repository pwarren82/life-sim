<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life Sim: Alpha 10.0 Hardcore Edition</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; height: 100vh; max-width: 700px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    h1 { font-size: 1.1rem; color: var(--accent); }
    button.icon-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    
    /* Top Quick-Status Bar */
    #status-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; margin-bottom: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .stat-item { color: var(--muted); }
    .stat-val { color: var(--text); font-weight: bold; }
    
    /* Unified Narrative & YAML Log Box */
    #log-container { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-y: auto; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; margin-bottom: 8px; }

    /* Bottom Action Input Box */
    #input-card { display: flex; gap: 6px; }
    #move-input { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; font-size: 0.95rem; resize: none; height: 50px; }
    .action-btn { background: var(--accent); color: #000; font-weight: bold; border: none; border-radius: 8px; padding: 0 18px; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    
    /* Settings Modal */
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); padding: 16px; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-content textarea, .modal-content input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; margin: 8px 0; }
  </style>
</head>
<body>

  <header>
    <h1>LIFE SIMULATOR (Alpha 10.0)</h1>
    <div>
      <button class="icon-btn" onclick="openSettings()">⚙️ Settings</button>
      <button class="icon-btn" onclick="resetGame()">🔄 Reset</button>
    </div>
  </header>

  <div id="status-card">
    <div class="stat-item">Protagonist: <span id="stat-name" class="stat-val">Uninitialized</span></div>
    <div class="stat-item">Age: <span id="stat-age" class="stat-val">--</span></div>
    <div class="stat-item">Cash / Net: <span id="stat-fin" class="stat-val">--</span></div>
    <div class="stat-item">Mood / Energy: <span id="stat-mood" class="stat-val">--</span></div>
  </div>

  <div id="log-container"></div>

  <div id="input-card">
    <textarea id="move-input" placeholder="Type your action / move here..."></textarea>
    <button class="action-btn" id="exec-btn" onclick="handleTurn()">SEND</button>
  </div>

  <div id="modal">
    <div class="modal-content">
      <h3>Settings & Rules (Alpha 10.0)</h3>
      <label>Google AI Studio API Key:</label>
      <input type="password" id="api-key-input" placeholder="Paste AI Studio Key">
      
      <label>Master Rules & Prompt (Alpha 10.0):</label>
      <textarea id="rules-input" rows="8"></textarea>

      <div style="display:flex; justify-content:space-between; margin-top:8px;">
        <button class="icon-btn" onclick="closeSettings()">Cancel</button>
        <button class="icon-btn" style="background:var(--accent); color:#000;" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const PHASE_1_QUESTIONNAIRE = `=====================================================
         PHASE 1: CHARACTER INITIALIZATION PROTOCOL
=====================================================
Please fill out and submit the starting questionnaire below:

1. Full Name & Aliases:
2. Starting Date & Historical Setting (Month & Year, e.g., October 1940 or June 2004):
3. Age & Birth Month (Exact starting age in XX Yrs YY Mos format, e.g., 24 Yrs 03 Mos):
4. Demographics, Gender, Heritage, Race, & Sexual Orientation:
5. Socioeconomic Background, Class Origin, & Family Safety Net Tier (Tier 1 Subsistence to Tier 5 Elite Capitalist):
6. Creed, Faith, Cultural Traditions, Intergenerational Obligations & Dietary/Observance Baseline:
7. Health Baseline, Physical Traits, Known Medical Conditions, or Active Disabilities:
8. Sex Education Tier (Tier 0 Uninformed to Tier 3 Expert), Reproductive Health Baseline, Contraceptive Preferences & Sexual Desires/Inclinations:
9. Personality Profile, Strengths, Major Flaws, & Core Psychological Triggers/Fears (Primary sources of anxiety or panic):
10. Psychological Tier, Vice Vectors, & Coping Outlets:
11. Appearance, Fashion, Style & Sensory Markers:
12. Core Domain Expertise, Aptitudes & Industry/Career Path:
13. Lifetime Aspiration Path, Primary Goal Vectors, & Pyrrhic Wants (Vices/flaws that grant points but cause friction):
14. Passions, Hobbies, Lifelong Instruments/Talents & Primary Recovery Outlets:
15. Location, Housing, Regional Context & Initial Financial Assets:
16. Starting Lineage, Kinship & Network Anchors (List known direct family, lateral kin, lifelong NPC talents/traits, military service records, defined historical milestones, close friends, or workplace rivals):
=====================================================
Type your responses below and click SEND to initiate Phase 1.5 & Turn 1.`;

    const ALPHA_10_RULES = `SYSTEM IDENTITY: Master Prompt Alpha 10.0 (Hardcore Life & Dynasty Simulation Engine)
DIFFICULTY: 7.5/10 (Steadfast Realism, Active Friction, Zero Cozy Bias)
PERSPECTIVE: Strict 1ST-PERSON ("I/Me/My")
TIME: 1 Turn = Exactly 1 Calendar Month (Increment: XX Yrs YY Mos)

---

### SECTION 1: CORE ENGINE DIRECTIVES (NON-NEGOTIABLE)
1. ANTI-COZINESS & SYSTEMIC RESISTANCE: Default LLM helpfulness is BANNED. Every turn MUST inflict friction, trade-offs, or collateral costs. No action resolves 100% cleanly. (Exception: 5% Coziness RNG roll).
2. UNFILTERED REALISM & INTIMACY: Zero fade-to-black. Adult intimacy requires Tri-Vector Visceral Immersion (Somatics, Mechanics, Interiority). Render physical hazards, somatic health, and toxic human relations with cold, clinical, or visceral precision.
3. FAIL-CLOSED AUDIT: Prior to generating narrative, you MUST run the Pre-Flight Evaluation block, verifying Chronology, Finance math, Roster updates, and Anti-Cozy friction.
4. IMMUTABLE LORE & ROSTER INTEGRITY: LORE_LEDGER facts and NPC lifelong traits are permanent. Strictly enforce the Banned Name list (Marcus, Chloe, Julian, Thorne, Vance, Vane, Aronson, Lindqvist, Leo, Aris).

---

### SECTION 2: THE 4-STEP PRE-FLIGHT EVALUATION (<pre_flight_eval>)
Before outputting any text, calculate and verify the following inside <pre_flight_eval>:
- S1: MATH & TIME: Update Cash (Inflows - Outflows), Debt, and age (+1 Mo for all entities). Check annual CPI/COLA if Turn % 12 == 0/1.
- S2: FRICTION & ANTI-COZY: Confirm systemic resistance was injected. Verify Skill Gap penalties (Delta 0: Cost, Delta 1: Partial, Delta 2+: Failure/Trap).
- S3: ROSTER & LORE: Audit Dynasty/Network rosters. Prune unanchored casual contacts ([SOC-*]) after 4 turns of zero interaction. Ensure direct kin/spouses have immunity.
- S4: DYNAMICS & ARCS: Process active Narrative Seeds, 2-4 autonomous NPC lifecycle shifts, health countdowns, and potential Breakup/Milestone hard-stops.

---

### SECTION 4: OUTPUT FORMAT
Every turn MUST follow this exact sequence:
1. <pre_flight_eval> (The 4-step verification block above)
2. STATUS_ANCHOR (YAML block) + PLAYER QUICK-DASHBOARD (ASCII meters)
3. PART 1: The Life Chronicle (Status acknowledgment, narrative crucible, life audit)
4. PART 2: The Detailed Life Log (Unfiltered prose, Tri-Vector intimacy, NPC interactions, action outcomes)
5. PART 3: The Neighborhood & Family Log (Delta-only markdown table for selected 2-4 NPCs)
[FOOTER]: Turn Count | Current Date`;

    let state = {
      apiKey: localStorage.getItem('life_sim_api_key') || '',
      rules: localStorage.getItem('life_sim_rules') || ALPHA_10_RULES,
      statusAnchor: localStorage.getItem('life_sim_anchor') || '',
      logHistory: localStorage.getItem('life_sim_log') || PHASE_1_QUESTIONNAIRE
    };

    document.getElementById('log-container').innerText = state.logHistory;
    updateStatusCard(state.statusAnchor);

    if (!state.statusAnchor) {
      document.getElementById('move-input').value = `Initialize Character:\n1. Full Name: \n2. Starting Date: \n3. Age (XX Yrs YY Mos): \n4. Demographics: \n5. Class Tier: \n6. Creed/Traditions: \n7. Health Baseline: \n8. Sex Ed & Contraception: \n9. Traits/Flaws: \n10. Psychological Tier: \n11. Style & Markers: \n12. Career/Aptitudes: \n13. Aspiration Path: \n14. Hobbies/Passions: \n15. Location & Assets: \n16. Starting Lineage & Network: `;
    }

    function openSettings() {
      document.getElementById('api-key-input').value = state.apiKey;
      document.getElementById('rules-input').value = state.rules;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeSettings() { 
      document.getElementById('modal').style.display = 'none'; 
    }

    function saveSettings() {
      state.apiKey = document.getElementById('api-key-input').value.trim();
      state.rules = document.getElementById('rules-input').value;
      localStorage.setItem('life_sim_api_key', state.apiKey);
      localStorage.setItem('life_sim_rules', state.rules);
      closeSettings();
    }

    function resetGame() {
      if (confirm("Reset game state and character memory? This will return to the Phase 1 questionnaire.")) {
        localStorage.clear();
        state.statusAnchor = '';
        state.logHistory = PHASE_1_QUESTIONNAIRE;
        location.reload();
      }
    }

    function updateStatusCard(yamlText) {
      if (!yamlText) return;
      const getVal = (key) => {
        const m = yamlText.match(new RegExp(`${key}:\\s*(.+)`, 'i'));
        return m ? m[1].replace(/['"]/g, '').trim() : '--';
      };
      document.getElementById('stat-name').innerText = getVal('Name') || getVal('Protagonist_Name');
      document.getElementById('stat-age').innerText = getVal('Age');
      document.getElementById('stat-fin').innerText = getVal('Cash') || getVal('Net') || getVal('Fin');
      document.getElementById('stat-mood').innerText = getVal('Mood');
    }

    async function handleTurn() {
      const inputEl = document.getElementById('move-input');
      const action = inputEl.value.trim();
      if (!action) return;
      if (!state.apiKey) { 
        alert('Please add your Google AI Studio API key in Settings.'); 
        openSettings(); 
        return; 
      }

      const logEl = document.getElementById('log-container');
      const btn = document.getElementById('exec-btn');
      btn.disabled = true;
      logEl.innerText += `\n\n> Action: ${action}\n\n[Processing Alpha 10.0 pre-flight audit & turn execution...]`;
      logEl.scrollTop = logEl.scrollHeight;

      const promptPayload = `${state.rules}\n\n=== IMMUTABLE STATE ANCHOR ===\n${state.statusAnchor}\n\n=== COMPLETE PREVIOUS NARRATIVE HISTORY ===\n${state.logHistory}\n\n=== CURRENT PLAYER ACTION ===\n${action}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${state.apiKey}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': state.apiKey
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptPayload }] }],
            safetySettings: [
              { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
              { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
              { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
              { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
            ]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates[0].content.parts[0].text;
        
        // Extract YAML Status Anchor to update status header
        const yamlMatch = reply.match(/```yaml([\s\S]*?)```/i) || reply.match(/STATUS ANCHOR[\s\S]*?(?=\n\n|\n[A-Z])/i);
        if (yamlMatch) {
          state.statusAnchor = yamlMatch[0];
          localStorage.setItem('life_sim_anchor', state.statusAnchor);
          updateStatusCard(state.statusAnchor);
        }

        state.logHistory = reply;
        localStorage.setItem('life_sim_log', reply);
        logEl.innerText = reply;
        logEl.scrollTop = 0;
        inputEl.value = '';

      } catch (err) {
        logEl.innerText += `\n\nAPI Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
