<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life Sim: Hard-Locked Edition</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --yaml-bg: #0b1120;
      --accent: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; height: 100vh; max-width: 700px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    h1 { font-size: 1.1rem; color: var(--accent); }
    button.icon-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    
    /* Top Quick-Status Bar */
    #status-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; margin-bottom: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .stat-item { color: var(--muted); }
    .stat-val { color: var(--text); font-weight: bold; }

    /* Visual Portrait Card */
    #visual-card { display: none; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 8px; text-align: center; }
    #visual-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    #visual-caption { font-size: 0.8rem; color: var(--muted); margin-top: 4px; font-style: italic; }
    #img-status { font-size: 0.8rem; color: #38bdf8; margin: 4px 0; display: none; }
    
    /* Middle Narrative Log Box */
    #log-container { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-y: auto; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; margin-bottom: 8px; min-height: 180px; }
    
    /* Dedicated YAML Box Below Middle Box */
    #yaml-box-wrapper { display: flex; flex-direction: column; margin-bottom: 8px; }
    .yaml-header { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 3px; padding-left: 2px; }
    #yaml-container { background: var(--yaml-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; height: 135px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.8rem; line-height: 1.4; color: #38bdf8; white-space: pre-wrap; }

    /* Bottom Action Input Box */
    #input-card { display: flex; gap: 6px; }
    #move-input { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; font-size: 0.95rem; resize: none; height: 50px; }
    .action-btn { background: var(--accent); color: #000; font-weight: bold; border: none; border-radius: 8px; padding: 0 14px; cursor: pointer; }
    .cam-btn { background: #3b82f6; color: #fff; font-weight: bold; border: none; border-radius: 8px; padding: 0 10px; cursor: pointer; font-size: 0.9rem; }
    button:disabled { opacity: 0.5; }
    
    /* Settings Modal */
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); padding: 16px; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-content textarea, .modal-content input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; margin: 8px 0; }
  </style>
</head>
<body>

  <header>
    <h1>LIFE SIMULATOR</h1>
    <div>
      <button class="icon-btn" onclick="openSettings()">⚙️ Settings</button>
      <button class="icon-btn" onclick="resetGame()">🔄 Reset</button>
    </div>
  </header>

  <div id="status-card">
    <div class="stat-item">Protagonist: <span id="stat-name" class="stat-val">Uninitialized</span></div>
    <div class="stat-item">Age: <span id="stat-age" class="stat-val">--</span></div>
    <div class="stat-item">Cash / Net: <span id="stat-fin" class="stat-val">--</span></div>
    <div class="stat-item">Mood / Energy: <span id="stat-mood" class="stat-val">--</span></div>
  </div>

  <div id="visual-card">
    <img id="visual-img" src="" alt="Milestone Portrait">
    <div id="visual-caption">Character Milestone Visual</div>
  </div>
  <div id="img-status"></div>

  <div id="log-container"></div>

  <div id="yaml-box-wrapper">
    <div class="yaml-header">Active YAML Status Anchor</div>
    <div id="yaml-container">No active YAML state yet. Complete Phase 1 initialization above to generate Turn 1 parameters.</div>
  </div>

  <div id="input-card">
    <textarea id="move-input" placeholder="Type your action / move here..."></textarea>
    <button class="cam-btn" title="Generate Milestone Visual for Current State" onclick="triggerManualImage()">📸 Visual</button>
    <button class="action-btn" id="exec-btn" onclick="handleTurn()">SEND</button>
  </div>

  <div id="modal">
    <div class="modal-content">
      <h3>Settings & Rules</h3>
      <label>Google AI Studio API Key:</label>
      <input type="password" id="api-key-input" placeholder="Paste AI Studio Key">
      
      <label>Master Rules & Prompt:</label>
      <textarea id="rules-input" rows="8"></textarea>
      
      <label>Active Identity Lock Roster (Visual DNA):</label>
      <textarea id="roster-dna-input" rows="4" placeholder="Character Visual DNA stored here..."></textarea>

      <div style="display:flex; justify-content:space-between; margin-top:8px;">
        <button class="icon-btn" onclick="closeSettings()">Cancel</button>
        <button class="icon-btn" style="background:var(--accent); color:#000;" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const PHASE_1_QUESTIONNAIRE = `=====================================================
         PHASE 1: CHARACTER INITIALIZATION PROTOCOL
=====================================================
Please fill out and submit the starting questionnaire below:

1. Full Name & Aliases:
2. Starting Date & Historical Setting (e.g., October 1940 or June 1985):
3. Age & Birth Month (Format: XX Yrs YY Mos, e.g., 24 Yrs 03 Mos):
4. Demographics, Gender, Heritage, Race, & Sexual Orientation:
5. Socioeconomic Background, Class Origin, & Family Safety Net Tier (Tier 1 Subsistence to Tier 5 Elite Capitalist):
6. Creed, Faith, Cultural Traditions, Intergenerational Obligations & Dietary Baseline:
7. Health Baseline, Physical Traits, Known Medical Conditions, or Active Disabilities:
8. Sex Education Tier (Tier 0 to Tier 3), Reproductive Health Baseline & Contraceptive Preferences:
9. Personality Profile, Strengths, Major Flaws, & Core Psychological Triggers/Fears:
10. Psychological Tier, Vice Vectors, & Coping Outlets:
11. Appearance, Fashion, Style & Sensory Markers:
12. Core Domain Expertise, Aptitudes & Industry/Career Path:
13. Lifetime Aspiration Path, Primary Goal Vectors, & Pyrrhic Wants:
14. Passions, Hobbies, Lifelong Instruments/Talents & Primary Recovery Outlets:
15. Location, Housing, Regional Context & Initial Financial Assets:
16. Starting Network Roster & Immutable Backstory Anchors (Key family, close friends, or rivals):
=====================================================
Type your responses below and click SEND to initiate Phase 1.5 & Turn 1.`;

    const DEFAULT_RULES = `SYSTEM IDENTITY & OPERATIONAL BASELINE:
Protocol: Hard-Locked Realism Life Simulator. Strict 1st-person POV ("I/Me/My").
Enforce strict difficulty (6.75/10 to 7.5/10), zero-cozy bias, 75%-90% expertise gates on out-of-lane attempts, monotonic monthly modulo aging (+1 Mo/turn), step-by-step arithmetic reconciliation, and multi-turn chronic fallout.
Every response MUST output a clean \`\`\`yaml Status Anchor at the top containing Protagonist_Name, Date, Age, Fin (Cash/Debt/Net), Mood, Rel_Tension, and Network_Roster, followed by the itemized Life Log.

MANDATORY VISUAL PROTOCOL:
At the very end of your response, after the turn footer, you MUST output an image directive formatted exactly as:
\`\`\`image_prompt
Character: [Character Name]
Type: [NEW_CHARACTER | MILESTONE_UPDATE | MULTI_CHARACTER_SCENE]
Prompt: [High-fidelity cinematic photorealistic portrait prompt describing facial structure, age, expression, clothing, lighting, and environmental context]
\`\`\``;

    let state = {
      apiKey: localStorage.getItem('life_sim_api_key') || '',
      rules: localStorage.getItem('life_sim_rules') || DEFAULT_RULES,
      statusAnchor: localStorage.getItem('life_sim_anchor') || '',
      logHistory: localStorage.getItem('life_sim_log') || PHASE_1_QUESTIONNAIRE,
      lastImage: localStorage.getItem('life_sim_image') || '',
      lastCaption: localStorage.getItem('life_sim_caption') || '',
      dnaRoster: localStorage.getItem('life_sim_dna') || ''
    };

    document.getElementById('log-container').innerText = state.logHistory;
    if (state.lastImage) displayImage(state.lastImage, state.lastCaption);
    updateStatusCard(state.statusAnchor);
    updateYamlBox(state.statusAnchor);

    if (!state.statusAnchor) {
      document.getElementById('move-input').value = `Initialize Character:\n1. Name: \n2. Date: \n3. Age: \n4. Demographics: \n5. Class: \n6. Creed: \n7. Health: \n8. Sex Ed: \n9. Traits/Flaws: \n10. Vices: \n11. Style: \n12. Career/Skills: \n13. Aspiration: \n14. Hobbies: \n15. Location/Finances: \n16. Starting Network: `;
    }

    function openSettings() {
      document.getElementById('api-key-input').value = state.apiKey;
      document.getElementById('rules-input').value = state.rules;
      document.getElementById('roster-dna-input').value = state.dnaRoster;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeSettings() { 
      document.getElementById('modal').style.display = 'none'; 
    }

    function saveSettings() {
      state.apiKey = document.getElementById('api-key-input').value.trim();
      state.rules = document.getElementById('rules-input').value;
      state.dnaRoster = document.getElementById('roster-dna-input').value;
      localStorage.setItem('life_sim_api_key', state.apiKey);
      localStorage.setItem('life_sim_rules', state.rules);
      localStorage.setItem('life_sim_dna', state.dnaRoster);
      closeSettings();
    }

    function resetGame() {
      if (confirm("Reset game state and character memory? This will return to the Phase 1 questionnaire.")) {
        localStorage.clear();
        state.statusAnchor = '';
        state.logHistory = PHASE_1_QUESTIONNAIRE;
        state.lastImage = '';
        state.lastCaption = '';
        state.dnaRoster = '';
        location.reload();
      }
    }

    function displayImage(base64Data, caption) {
      const card = document.getElementById('visual-card');
      const img = document.getElementById('visual-img');
      const cap = document.getElementById('visual-caption');
      img.src = `data:image/png;base64,${base64Data}`;
      cap.innerText = caption || "Character Visual";
      card.style.display = 'block';
    }

    function setImgStatus(msg, isError = false) {
      const el = document.getElementById('img-status');
      if (!msg) { 
        el.style.display = 'none'; 
        return; 
      }
      el.style.display = 'block';
      el.style.color = isError ? '#f87171' : '#38bdf8';
      el.innerText = msg;
    }

    function updateStatusCard(yamlText) {
      if (!yamlText) return;
      const getVal = (key) => {
        const m = yamlText.match(new RegExp(`${key}:\\s*(.+)`, 'i'));
        return m ? m[1].replace(/['"]/g, '').trim() : '--';
      };
      document.getElementById('stat-name').innerText = getVal('Protagonist_Name');
      document.getElementById('stat-age').innerText = getVal('Age');
      document.getElementById('stat-fin').innerText = getVal('Fin') || getVal('Cash');
      document.getElementById('stat-mood').innerText = getVal('Mood');
    }

    function updateYamlBox(yamlText) {
      const yamlEl = document.getElementById('yaml-container');
      if (!yamlText) return;
      const cleanedYaml = yamlText.replace(/```yaml/gi, '').replace(/```/g, '').trim();
      yamlEl.innerText = cleanedYaml;
    }

    async function callImagenAPI(promptText, caption) {
      setImgStatus("Rendering character visual via Gemini Image Engine...");
      
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${state.apiKey}`;

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': state.apiKey
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: promptText }]
            }]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const parts = data.candidates?.[0]?.content?.parts || [];
        let base64Image = null;

        for (const part of parts) {
          if (part.inlineData && part.inlineData.data) {
            base64Image = part.inlineData.data;
            break;
          }
        }

        if (base64Image) {
          state.lastImage = base64Image;
          state.lastCaption = caption;
          localStorage.setItem('life_sim_image', base64Image);
          localStorage.setItem('life_sim_caption', caption);
          displayImage(base64Image, caption);
          setImgStatus("");
        } else {
          const fallbackText = parts.map(p => p.text || '').join(' ').trim();
          throw new Error(fallbackText || "No image data returned from API.");
        }
      } catch (err) {
        setImgStatus(`Image API Notice: ${err.message}`, true);
      }
    }

    async function triggerManualImage() {
      if (!state.apiKey) { 
        alert('Please enter your Google AI Studio API key in Settings.'); 
        openSettings(); 
        return; 
      }
      if (!state.statusAnchor && !state.logHistory) { 
        alert('Initialize your character first.'); 
        return; 
      }
      
      const pName = document.getElementById('stat-name').innerText;
      const pAge = document.getElementById('stat-age').innerText;
      const manualPrompt = `Cinematic photorealistic portrait of ${pName}, age ${pAge}. Realistic skin texture, natural lighting, expressive eyes, setting reflecting recent life events. 8k resolution.`;
      await callImagenAPI(manualPrompt, `${pName} (Age ${pAge})`);
    }

    async function handleTurn() {
      const inputEl = document.getElementById('move-input');
      const action = inputEl.value.trim();
      if (!action) return;
      if (!state.apiKey) { 
        alert('Please add your Google AI Studio API key in Settings.'); 
        openSettings(); 
        return; 
      }

      const logEl = document.getElementById('log-container');
      const btn = document.getElementById('exec-btn');
      btn.disabled = true;
      logEl.innerText += `\n\n> Action: ${action}\n\n[Processing turn via Gemini 3.8 Flash...]`;
      logEl.scrollTop = logEl.scrollHeight;

      const promptPayload = `${state.rules}\n\nLOCKED IDENTITY ROSTER (VISUAL DNA):\n${state.dnaRoster}\n\nPREVIOUS STATUS ANCHOR:\n${state.statusAnchor}\n\nPLAYER ACTION:\n${action}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${state.apiKey}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': state.apiKey
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptPayload }] }],
            safetySettings: [
              { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
              { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
              { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
              { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
            ]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates[0].content.parts[0].text;
        let cleanTextOutput = reply;
        
        // Extract YAML Block, update YAML box, and strip it from the narrative box
        const yamlMatch = reply.match(/```yaml([\s\S]*?)```/i) || reply.match(/STATUS ANCHOR[\s\S]*?(?=\n\n|\n[A-Z])/i);
        if (yamlMatch) {
          state.statusAnchor = yamlMatch[0];
          localStorage.setItem('life_sim_anchor', state.statusAnchor);
          updateStatusCard(state.statusAnchor);
          updateYamlBox(state.statusAnchor);
          cleanTextOutput = cleanTextOutput.replace(yamlMatch[0], '').trim();
        }

        // Extract Image Prompt Block and strip it from the narrative box
        const imageMatch = cleanTextOutput.match(/```image_prompt([\s\S]*?)```/i);
        if (imageMatch) {
          cleanTextOutput = cleanTextOutput.replace(imageMatch[0], '').trim();
          const block = imageMatch[1];
          const charMatch = block.match(/Character:\s*(.*)/i);
          const typeMatch = block.match(/Type:\s*(.*)/i);
          const promptMatch = block.match(/Prompt:\s*([\s\S]*)/i);

          if (promptMatch && promptMatch[1]) {
            const charName = charMatch ? charMatch[1].trim() : 'Protagonist';
            const sceneType = typeMatch ? typeMatch[1].trim() : 'Portrait';
            const imgPrompt = promptMatch[1].trim();
            callImagenAPI(imgPrompt, `${charName} (${sceneType.replace(/_/g, ' ')})`);
          }
        }

        state.logHistory = cleanTextOutput;
        localStorage.setItem('life_sim_log', cleanTextOutput);
        logEl.innerText = cleanTextOutput;
        logEl.scrollTop = 0;
        inputEl.value = '';

      } catch (err) {
        logEl.innerText += `\n\nAPI Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
